name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 21 * * *" # daily, 02:47 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runtime dependencies must be clean; dev-only findings are reported but do not fail.
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm audit --audit-level=critical

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks CLI (the gitleaks-action needs a paid licence for organisation repos)
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --no-banner

  no-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stack has no PHP runtime (PHP2Shell class of bugs does not apply)
        run: |
          if git ls-files | grep -iE '\.(php|phtml|phar)$|composer\.(json|lock)$'; then
            echo "::error::PHP files found — review against PHP2Shell (CVE-2026-109618/109619) before merging"; exit 1
          fi

  client-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Server-only secrets are never referenced from client code
        run: |
          bad=$(grep -rlE '^"use client"' apps/web/src | xargs -r grep -lE 'SUPABASE_SECRET_KEY|SERVICE_ROLE|SARVAM_API_KEY|ANTHROPIC_API_KEY|FIELD_ENCRYPTION_KEY|lib/crypto|lib/ocr/sarvam' || true)
          pub=$(grep -rhoE 'NEXT_PUBLIC_[A-Z_]*(SECRET|SERVICE|PRIVATE|TOKEN)[A-Z_]*' apps/web/src || true)
          if [ -n "$bad$pub" ]; then echo "::error::secret reference in client code: $bad $pub"; exit 1; fi

  codeql:
    # Code scanning on private repos needs GitHub Advanced Security; skipped otherwise.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
