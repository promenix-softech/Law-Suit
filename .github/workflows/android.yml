name: Android APK

on:
  push:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle -p apps/android assembleDebug --no-daemon
      - name: Rename APK
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk CivilSuits-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CivilSuits-demo-apk
          path: CivilSuits-demo.apk
      - name: Publish as GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Civil Suits Android (demo build ${{ github.run_number }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: Demo APK (debug-signed). Opens https://civil-suits-manoj-76ab.vercel.app — synthetic data only.
          files: CivilSuits-demo.apk
