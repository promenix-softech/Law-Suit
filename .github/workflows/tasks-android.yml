name: Promenix Tasks APK

on:
  push:
    paths:
      - "apps/tasks-android/**"
      - ".github/workflows/tasks-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Release signing key (optional)
        env:
          TASKS_KEYSTORE_B64: ${{ secrets.TASKS_KEYSTORE_B64 }}
        run: |
          if [ -n "$TASKS_KEYSTORE_B64" ]; then
            echo "$TASKS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tasks.jks"
            echo "TASKS_KEYSTORE_PATH=$RUNNER_TEMP/tasks.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::TASKS_KEYSTORE_B64 not set; the APK is signed with a throwaway debug key"
          fi
      - name: Build release APK (R8 minified)
        env:
          TASKS_KEYSTORE_PASSWORD: ${{ secrets.TASKS_KEYSTORE_PASSWORD }}
          TASKS_KEY_ALIAS: ${{ secrets.TASKS_KEY_ALIAS }}
          TASKS_KEY_PASSWORD: ${{ secrets.TASKS_KEY_PASSWORD }}
        run: gradle -p apps/tasks-android assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp apps/tasks-android/app/build/outputs/apk/release/app-release.apk PromenixTasks.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PromenixTasks-apk
          path: PromenixTasks.apk
      - name: Publish as GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tasks-android-${{ github.run_number }}
          name: Promenix Tasks (build ${{ github.run_number }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: Promenix Tasks intern app. Release build (R8), device-lock gated, screenshots blocked.
          files: PromenixTasks.apk
