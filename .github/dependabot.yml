version: 2
updates:
  - package-ecosystem: npm # pnpm workspaces are handled by the npm ecosystem
    directory: "/"
    schedule:
      interval: daily
      time: "03:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      supabase:
        patterns: ["@supabase/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/apps/worker"
    schedule:
      interval: weekly
